services:
  shortcode-locker:
    build: .
    container_name: shortcode-locker
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      SHORTCODE_LOCKER_DATA: /data/codes.json
      PORT: "8765"
      # Docker Compose reads a local .env file automatically if present.
      SHORTCODE_LOCKER_TOKEN: ${SHORTCODE_LOCKER_TOKEN:-}
